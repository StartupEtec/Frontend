name: CI

on:
  push:
    branches: [develop, "0-fixing-stuff", main]
  pull_request:
    branches: [develop, "0-fixing-stuff", main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Run tests
        run: npm test

  deploy-develop:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync and restart frontend
        run: |
          set -e
          mkdir -p /home/Startup/deploy/frontend
          tar --exclude=.git --exclude=node_modules --exclude=coverage --exclude=.github -cf - . | tar -xf - -C /home/Startup/deploy/frontend
          docker compose --env-file /home/Startup/deploy/frontend.env -p laborin-frontend -f /home/Startup/deploy/frontend/docker-compose.local.yml up -d --build frontend
          curl -fsS https://app.laborin.app/ >/dev/null
