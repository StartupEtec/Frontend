name: CI

on:
  push:
    branches: [develop, "0-fixing-stuff", main]
  pull_request:
    branches: [develop, "0-fixing-stuff", main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Run tests
        run: npm test
